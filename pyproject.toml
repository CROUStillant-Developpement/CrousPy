[project]
name = "CrousPy"
version = "2.1.0"
description = "A Python wrapper for CROUS restaurant menus API."
authors = [{ name = "CROUStillant Développement" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "async-timeout>=5.0.1",
    "pytz>=2026.3.post1",
]

[project.urls]
homepage = "https://croustillant.menu"
repository = "https://github.com/CROUStillant-Developpement/CrousPy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.16",
]

[tool.ruff.lint]
ignore = [
    "N999",   # package/module names (CrousPy, menuCollection, ...) are the published public API
    "BLE001", # broad except-Exception is intentional: tolerating malformed/unexpected scraped HTML
    "S110",   # try-except-pass, same reason as BLE001
    "TRY002", # raising a plain Exception is intentional in a couple of scraper edge cases
]
